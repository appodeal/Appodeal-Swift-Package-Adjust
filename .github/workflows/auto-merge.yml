name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_run:
    # Must match the `name:` of auto_approve_prs.yml exactly, otherwise this
    # trigger silently never fires.
    workflows: ["Auto Approve PRs"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

env:
  # A merge made with GITHUB_TOKEN emits no events, so nothing downstream reacts
  # to it. Prefer the org PAT when the repository has been granted access to it;
  # then the merge is attributed to a real account and the normal push-triggered
  # automation works. Tagging does not depend on this — see the tag job below.
  GH_TOKEN: ${{ secrets.PAT_APPODEAL_RUNNER || secrets.GITHUB_TOKEN }}
  # These jobs deliberately do not check out the repository, and gh otherwise
  # infers the target repo from the git remote — `gh pr view 37` then dies with
  # "fatal: not a git repository". GH_REPO supplies that context instead.
  GH_REPO: ${{ github.repository }}

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.arm.outputs.pr }}
    if: |
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login == 'github-actions' ||
        github.event.pull_request.user.login == 'github-actions[bot]' ||
        github.event.pull_request.user.login == 'appodeal-runner' ||
        github.event.pull_request.user.login == 'appodeal-bot' ||
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'bot/') ||
        startsWith(github.event.pull_request.head.ref, 'claude/')
      )
    steps:
      - name: Enable auto-merge
        id: arm
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "📋 Merging PR: $PR_URL"
          echo "👤 Created by: ${{ github.event.pull_request.user.login }}"
          echo "🌿 Branch: ${{ github.event.pull_request.head.ref }}"

          # Report the PR before attempting anything, so the wait-and-tag jobs run
          # even if the merge itself has to happen later.
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Preferred path: hand the merge to GitHub, which performs it once the
          # branch protection conditions are met.
          if gh pr merge "$PR_URL" --auto --squash --delete-branch 2>/tmp/arm.err; then
            echo "✅ Auto-merge armed"
            exit 0
          fi

          cat /tmp/arm.err

          # Arming can be refused for several ordinary reasons — "Auto merge is not
          # allowed for this repository" when the setting is off, or "Pull request is
          # in unstable status" while a check is still running or red. None of them
          # mean the PR is broken, so none of them fail this job.
          #
          # Failing here is actively harmful: a red run of this workflow is itself a
          # failing check, which puts the next PR into unstable status, which refuses
          # arming again. PR #5 hit exactly that loop — it merged fine, yet the run
          # was red.
          #
          # Try a direct merge instead. Branch protection still decides whether that
          # is permitted, so nothing is bypassed; if it is not allowed yet,
          # merge-approved retries on the next event.
          echo "::warning::Could not arm auto-merge; attempting a direct merge instead"

          if gh pr merge "$PR_URL" --squash --delete-branch 2>/tmp/merge.err; then
            echo "✅ Merged"
            exit 0
          fi

          cat /tmp/merge.err
          echo "::warning::Could not merge yet (likely waiting on approval or checks); will retry on the next event"

  merge-approved:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merge.outputs.pr }}
    if: |
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Try to merge approved PR
        id: merge
        run: |
          # Resolve the PR this event belongs to
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "check_suite" ]; then
            PR_NUMBER="${{ github.event.check_suite.pull_requests[0].number }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Ask for the PRs associated with the commit rather than scanning the
            # open PR list: by the time this runs the PR is often already merged,
            # and /pulls only returns open ones — which is why this path reported
            # "No PR associated with this event" and skipped tagging 4.3.8.
            PR_NUMBER=$(gh api \
              "/repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq '.[0].number')
          fi

          if [ -z "${PR_NUMBER:-}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "No PR associated with this event"
            exit 0
          fi

          PR_URL="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          PR_DATA=$(gh pr view "${PR_NUMBER}" --json author,headRefName,state)
          PR_USER=$(echo "$PR_DATA" | jq -r '.author.login')
          PR_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')

          echo "📋 Checking PR: $PR_URL"
          echo "👤 Created by: $PR_USER"
          echo "🌿 Branch: $PR_BRANCH"

          # Same trust list as enable-auto-merge above
          if [[ "$PR_USER" != "github-actions" &&
                "$PR_USER" != "github-actions[bot]" &&
                "$PR_USER" != "appodeal-runner" &&
                "$PR_USER" != "appodeal-bot" &&
                ! "$PR_BRANCH" =~ ^release/ &&
                ! "$PR_BRANCH" =~ ^bot/ &&
                ! "$PR_BRANCH" =~ ^claude/ ]]; then
            echo "❌ PR is not from a trusted source"
            exit 0
          fi

          # Report the PR either way: if it is already merged the tag job still
          # has to run, because the merge itself started nothing.
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$PR_STATE" = "MERGED" ] || [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR is already $PR_STATE"
            exit 0
          fi

          APPROVED=$(gh pr view "$PR_URL" --json reviews --jq '[.reviews[] | select(.state == "APPROVED")] | length > 0')
          if [ "$APPROVED" != "true" ]; then
            echo "⏳ PR is not approved yet"
            exit 0
          fi

          CHECKS_PASSED=$(gh pr checks "$PR_URL" --json state --jq 'all(.state == "SUCCESS" or .state == "SKIPPED")' 2>/dev/null || echo "true")
          if [ "$CHECKS_PASSED" != "true" ]; then
            echo "⏳ Some checks are pending or failed — arming auto-merge instead"
            gh pr merge "$PR_URL" --auto --squash --delete-branch || true
            exit 0
          fi

          echo "✅ All conditions met, merging now"
          gh pr merge "$PR_URL" --squash --delete-branch

  # GitHub performs an armed auto-merge moments after the job above finishes, and
  # that merge produces no events. Wait for it here so the tag job below can run
  # in the same workflow instead of relying on a trigger that never fires.
  wait-for-merge:
    runs-on: ubuntu-latest
    needs: [enable-auto-merge, merge-approved]
    if: always() && (needs.enable-auto-merge.outputs.pr != '' || needs.merge-approved.outputs.pr != '')
    outputs:
      merged: ${{ steps.wait.outputs.merged }}
    steps:
      - name: Wait for the PR to be merged
        id: wait
        run: |
          PR_NUMBER="${{ needs.enable-auto-merge.outputs.pr || needs.merge-approved.outputs.pr }}"
          echo "⏳ Waiting for PR #${PR_NUMBER} to merge"

          # Auto-merge normally completes within seconds once approval lands.
          # Give it a few minutes, then give up quietly — a later push to main,
          # or a manual run of Auto Tag Release, still creates the tag.
          for attempt in $(seq 1 30); do
            # Never let a transient API hiccup kill the step under `bash -e` and
            # cost us the tag; an empty state just means "try again".
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              echo "✅ PR #${PR_NUMBER} is merged"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "PR #${PR_NUMBER} was closed without merging"
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "::warning::PR #${PR_NUMBER} did not merge within 5 minutes; no tag created"
          echo "merged=false" >> "$GITHUB_OUTPUT"

  # Runs unconditionally rather than gating on wait-for-merge's `merged` output.
  #
  # That gate did not work: on PR #4 wait-for-merge logged "PR #4 is merged" and
  # set the output, yet this job was still skipped, in both the pull_request and
  # the workflow_run run. Rather than keep guessing at the expression, drop it —
  # it was never load-bearing. tag-release.yml decides from the state of main and
  # the tags that already exist, so it is idempotent: if nothing merged, main is
  # unchanged and the newest tag already serves that manifest, and the job reports
  # "nothing to do". If main has drifted from its newest tag, it deserves a tag
  # regardless of what this particular PR did.
  #
  # needs: is kept purely for ordering, so tagging happens after the wait.
  tag:
    needs: wait-for-merge
    if: always()
    uses: ./.github/workflows/tag-release.yml
    permissions:
      contents: write
      pull-requests: write
